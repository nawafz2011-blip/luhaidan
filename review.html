<h1>مراجعة تلاوة محمد اللحيدان</h1>
<p class="sub">هذي الأماكن اللي الأداة تشك إن الشيخ قرأ فيها كلام من آية ثانية. اضغط «اسمع» يشغّل لك الآية واللي بعدها كاملتين، عشان تسمع الغلط والتصحيح، وبعدين اختر <b>غلط</b> أو <b>سليم</b>. اختياراتك تنحفظ في جهازك. إذا خلصت اضغط «انسخ الأغلاط» وأرسلها لي.</p>

52, "en": 218.64, "h": "قَالَ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ مُؤْمِنِينَ مُوقِنِينَ قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ قَالَ", "a2": 25}, {"id": "26_1", "s": 26, "n": "الفرقان", "a": 208, "t": 1474.4, "o": ["15:3"], "q": "وَمَا أَهْلَكْنَا مِنْ قَرْيَةٍ إِلَّا لَهَا مُنْذِرُونَ ۝ ذِكْرَىٰ وَمَا كُنَّا ظَالِمِينَ", "st": 1473.72, "en": 1487.12, "h": "وَمَا يَعْلَمُونَ وَمَا أَهْلَكْنَا مِنْ قَرْيَةٍ إِلَّا لَهَا مُنْذِرُونَ ذِكْرَى وَمَا كُنَّا ظَالِمِينَ", "a2": 209}, {"id": "27_0", "s": 27, "n": "الشعراء", "a": 7, "t": 59.5, "o": ["28:29"], "q": "إِذْ قَالَ مُوسَىٰ لِأَهْلِهِ إِنِّي آنَسْتُ نَارًا سَآتِيكُمْ مِنْهَا بِخَبَرٍ أَوْ آتِيكُمْ بِشِهَابٍ قَبَسٍ لَعَلَّكُمْ تَصْطَلُونَ ۝ فَلَمَّا جَاءَهَا نُودِيَ أَنْ بُورِكَ مَنْ فِي النَّارِ وَمَنْ حَوْلَهَا وَسُبْحَانَ اللَّهِ رَبِّ الْعَالَمِينَ", "st": 54.14, "en": 83.14, "h": "قَالَ مُوسَى لِأَهْلِهِ إِنِّي آنَسْتُ نَارًا سَآ أَتِيكُمْ مِنْهَا بِخَبَرٍ أَوْ آتِيكُمْ بِشِهَابٍ قَبَسٍ لَعَلَّكُمْ تَصْطَلُونَ فَلَمَّا جَاءَهَا نُودِيَ أَنْ نُودِكَ مَنْ فِي النَّارِ وَمَنْ حَوْلَهَا وَسُبْحَانَ اللَّهِ رَبِّ الْعَالَمِينَ", "a2": 8}, {"id": "27_1", "s": 27, "n": "الشعراء", "a": 16, "t": 187.1, "o": ["2:251"], "q": "وَوَرِثَ سُلَيْمَانُ دَاوُودَ ۖ وَقَالَ يَا أَيُّهَا النَّاسُ عُلِّمْنَا مَنْطِقَ الطَّيْرِ وَأُوتِينَا مِنْ كُلِّ شَيْءٍ ۖ إِنَّ هَٰذَا لَهُوَ الْفَضْلُ الْمُبِينُ ۝ وَحُشِرَ لِسُلَيْمَانَ جُنُودُهُ مِنَ الْجِنِّ وَالْإِنْسِ وَالطَّيْرِ فَهُمْ يُوزَعُونَ", "st": 184.52, "en": 217.24, "h": "وَوَرِثَ سُلَيْمَانُ دَاوُودَ وَآتَاهُ اللَّهُ الْمُلْكُ وَقَالَ يَا أَيُّهَا النَّاسُ عَلِّمْنَا مَنْطِقَ الطَّيْرُ وَأُوتِينَا مِنْ كُلِّ شَيْءٍ إِنَّ هَذَا لَهُوَ الْفَضْلُ الْمُبِينُ وَحُشِرَ لِسُلَيْمَانِ وَنَجُنُودُهُ مِنَ الْجِنِّ وَالْإِنْسِ وَالطَّيْرِ فَهُمْ يُوزَعُونَ", "a2": 17}, {"id": "27_2", "s": 27, "n": "الشعراء", "a": 19, "t": 254.1, "o": ["46:15"], "q": "فَتَبَسَّمَ ضَاحِكًا مِنْ قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ ۝ وَتَفَقَّدَ الطَّيْرَ فَقَالَ مَا لِيَ لَا أَرَى الْهُدْهُدَ أَمْ كَانَ مِنَ الْغَائِبِينَ", "st": 237.08, "en": 294.2, "h": "ضَاحِكًا بَص مِنْ قَوْلِهَا وَقَالَ رَبِّ أَوْزِيْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْنِي فِي ذَرِّيَّتِي إِنِّي تُبْتُ إِلَيْكَ فَتَبَسَّمَ ضَاحِكًا مِنْ قَوْلِنَا وَقَالَ رَبِّ أَوْزِيْن فِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنَّ اعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ وَتَفَقَّدَ الطَّيْرَ فَقَالَ مَا لِيَ لَا أَرَى الْهُدْهُدَ أَمْ كَانَ مِنَ الْغَائِبِينَ", "a2": 20}, {"id": "27_3", "s": 27, "n": "الشعراء", "a": 40, "t": 555.6, "o": ["3:97", "31:12"], "q": "قَالَ الَّذِي عِنْدَهُ عِلْمٌ مِنَ الْكِتَابِ أَنَا آتِيكَ بِهِ قَبْلَ أَنْ يَرْتَدَّ إِلَيْكَ طَرْفُكَ ۚ فَلَمَّا رَآهُ مُسْتَقِرًّا عِنْدَهُ قَالَ هَٰذَا مِنْ فَضْلِ رَبِّي لِيَبْلُوَنِي أَأَشْكُرُ أَمْ أَكْفُرُ ۖ وَمَنْ شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ ۖ وَمَنْ كَفَرَ فَإِنَّ رَبِّي غَنِيٌّ كَرِيمٌ ۝ قَالَ نَكِّرُوا لَهَا عَرْشَهَا نَنْظُرْ أَتَهْتَدِي أَمْ تَكُونُ مِنَ الَّذِينَ لَا يَهْتَدُونَ", "st": 524.14, "en": 597.0, "h": "قَالَ الَّذِي عِنْدَهُ عِلْمٌ مِنَ الْكِتَابِ أَنَا آتِيكَ بِهِ قَبْلَ أ إِنْ يَرْتَدْتَ إِلَيْكَ ضَرْفُكَ فَلَمَّا رَآهُ مُسْتَقِرًّا عِنْدَهُ قَالَ هَذَا مِنْ فَضْلِ رَبِّي لِيَبْلُغَنِي أَأَشْكُرُ أَمْ أَكْفُرُ وَمَنْ شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ وَمَنْ كَفَرَ فَإِنَّ اللَّهَ لَغَنِيٌّ حَمِيدٌ وَالِمِينَ قَالَ نَكِّرُوا لَهَا عَرْشَمَا نَنْظُرْ أَتَهْتَدِي أَمْ تَكُونُ مِنَ الَّذِينَ لَا يَهْتَدُونَ فَإِنَّ رَبِّي لَغَنِيٌّ حَمِيدٌ فَإِنَّ رَبِّي لَغَنِيٌّ كَرِيمٌ وَالْمُؤْمِنِينَ فَإِنَّ رَبِّي غَنِيٌّ كَرِيمٌ قَالَ نَكِّرُونَهَا عَرْشَهَا نَغَاضُرْ أَتَهْتَتِي أَمْ تَكُونُ مِنَ الَّذِينَ لَا يَهْتَدُونَ", "a2": 41}, {"id": "27_4", "s": 27, "n": "الشعراء", "a": 69 }
