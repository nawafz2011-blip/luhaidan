<h1>مراجعة تلاوة محمد اللحيدان</h1>
<p class="sub">هذي الأماكن اللي الأداة تشك إن الشيخ قرأ فيها كلام من آية ثانية. اضغط «اسمع» يشغّل لك المقطع (١٥ ثانية تقريباً)، وبعدين اختر <b>غلط</b> أو <b>سليم</b>. اختياراتك تنحفظ في جهازك. إذا خلصت اضغط «انسخ الأغلاط» وأرسلها لي.</p>

<span class="count" id="count"></span>

</div>

id": "2_22", "s": 2, "n": "البقرة", "a": 283, "t": 6830.4, "o": ["2:194", "2:196"], "h": "ومن يكتمها فانه اتم قلبه واتقوا الله واعلموا ان الله بما تعملون عليم واتقوا الله والله", "q": "۞ وَإِنْ كُنْتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَقْبُوضَةٌ ۖ فَإِنْ أَمِنَ بَعْضُكُمْ بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللَّهَ رَبَّهُ ۗ وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَنْ يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ"}, {"id": "2_23", "s": 2, "n": "البقرة", "a": 283, "t": 6841.7, "o": ["8:47"], "h": "الله بما تعملون عليم واتقوا الله والله بما تعملوا معليم لله ما", "q": "۞ وَإِنْ كُنْتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَقْبُوضَةٌ ۖ فَإِنْ أَمِنَ بَعْضُكُمْ بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللَّهَ رَبَّهُ ۗ وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَنْ يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ"}, {"id": "3_0", "s": 3, "n": "آل", "a": 19, "t": 397.8, "o": ["7:129"], "h": "اوتوا الكتاب الا ما يومنون ومن بعد ما جاءهم العلم بغيا بينهم", "q": "إِنَّ الدِّينَ عِنْدَ اللَّهِ الْإِسْلَامُ ۗ وَمَا اخْتَلَفَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِنْ بَعْدِ مَا جَاءَهُمُ الْعِلْمُ بَغْيًا بَيْنَهُمْ ۗ وَمَنْ يَكْفُرْ بِآيَاتِ اللَّهِ فَإِنَّ اللَّهَ سَرِيعُ الْحِسَابِ"}, {"id": "3_1", "s": 3, "n": "آل", "a": 45, "t": 974.3, "o": ["24:19"], "h": "المسيح عيسي ابن مريم وجيها اليم في الدنيا والاخره وجيها في الدنيا", "q": "إِذْ قَالَتِ الْمَلَائِكَةُ يَا مَرْيَمُ إِنَّ اللَّهَ يُبَشِّرُكِ بِكَلِمَةٍ مِنْهُ اسْمُهُ الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ وَجِيهًا فِي الدُّنْيَا وَالْآخِرَةِ وَمِنَ الْمُقَرَّبِينَ"}, {"id": "3_2", "s": 3, "n": "آل", "a": 66, "t": 1336.2, "o": ["4:109"], "h": "من بعده افلا تعقلون ها انتم هولاء جادلتم هومون انتم هولاء حاججتم", "q": "هَا أَنْتُمْ هَٰؤُلَاءِ حَاجَجْتُمْ فِيمَا لَكُمْ بِهِ عِلْمٌ فَلِمَ تُحَاجُّونَ فِيمَا لَيْسَ لَكُمْ بِهِ عِلْمٌ ۚ وَاللَّهُ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ"}, {"id": "3_3", "s": 3, "n": "آل", "a": 77, "t": 1551.6, "o": ["2:174"], "h": "يشترون بعهد الله وايمانهم ثمنا قليلا اوليك ما ياكلون اوليك لا خلاق لهم", "q": "إِنَّ الَّذِينَ يَشْتَرُونَ بِعَهْدِ اللَّهِ وَأَيْمَانِهِمْ ثَمَنًا قَلِيلًا أُولَٰئِكَ لَا خَلَاقَ لَهُمْ فِي الْآخِرَةِ وَلَا يُكَلِّمُهُمُ اللَّهُ وَلَا يَنْظُرُ إِلَيْهِمْ يَوْمَ الْقِيَامَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ"}, {"id": "3_4", "s": 3, "n": "آل", "a": 81, "t": 1672.3, "o": ["3:52"], "h": "علي ذلكم اصري قالوا اقررنا واشهد بانا مسلمون قالوا اقررنا قال فاشهدوا", "q": "وَإِذْ أَخَذَ اللَّهُ مِيثَاقَ النَّبِيِّينَ لَمَا آتَيْتُكُمْ مِنْ كِتَابٍ وَحِكْمَةٍ ثُمَّ جَاءَكُمْ رَسُولٌ مُصَدِّقٌ لِمَا مَعَكُمْ لَتُؤْمِنُنَّ بِهِ وَلَتَنْصُرُنَّهُ ۚ قَالَ أَأَقْرَرْتُمْ وَأَخَذْتُمْ عَلَىٰ ذَٰلِكُمْ إِصْرِي ۖ قَالُوا أَقْرَرْنَا ۚ قَالَ فَاشْهَدُوا وَأَنَا مَعَكُمْ مِنَ الشَّاهِدِينَ"}, {"id": "3_5", "s": 3, "n": "آل", "a": 82, "t": 1694.1, "o": ["59:19"], "h": "تولي بعد ذلك فاوليك هبواء اوليك هم الفاسقون افغير دين الله يبغون", "q": "فَمَنْ تَوَلَّىٰ بَعْدَ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْفَاسِقُونَ"}, {"id": "3_6", "s": 3, "n": "آل", "a": 86, "t": 1784.0, "o": ["5:51", "5:67"], "h": "الرسول حق وجاءهم البينات واولهم الله لا يهدي القوم الظالمين اوليك دزاوهم", "q": "كَيْفَ يَهْدِي اللَّهُ قَوْمًا كَفَرُوا بَعْدَ إِيمَانِهِمْ وَشَهِدُوا أَنَّ الرَّسُولَ حَقٌّ وَجَاءَهُمُ الْبَيِّنَاتُ ۚ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ"}, {"id": "3_7", "s": 3, "n": "آل", "a": 103, "t": 2053.5, "o": ["5:7"], "h": "بحبد الله جميعا ولا تفرقوا واذكروا نعمه الله عليكم اذ كنتم اعداء بصيرا", "q": "وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا ۚ وَاذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ إِذْ كُنْتُمْ أَعْدَاءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُمْ بِنِعْمَتِهِ إِخْوَانًا وَكُنْتُمْ عَلَىٰ شَفَا حُفْرَةٍ مِنَ النَّارِ فَأَنْقَذَكُمْ مِنْهَا ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَهْتَدُونَ"}, {"id": "3_8", "s": 3, "n": "آل", "a": 112, "t": 2262.2, "o": ["2:61", "59:13"], "h": "وحبل من الناس وباءوا بغضب من الله const BASE="https://nawafz2011-blip.github.io/luhaidan/";
let marks={};try{marks=JSON.parse(localStorage.getItem("lh_marks")||"null")||{"36_0":"err"}}catch(e){marks={"36_0":"err"}}
let filter="todo",db=null;
function save(){try{localStorage.setItem("lh_marks",JSON.stringify(marks))}catch(e){}}
const audio=new Audio();let stopAt=0,playing=null;
audio.addEventListener("timeupdate",()=>{if(audio.currentTime>=stopAt){audio.pause();setPlay(null)}});
function fmt(t){t=Math.max(0,Math.round(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
function setPlay(id){playing=id;document.querySelectorAll(".play").forEach(b=>b.textContent=b.dataset.id===id?"إيقاف":"اسمع")}
function play(r){
  if(playing===r.id){audio.pause();setPlay(null);return}
  const src=BASE+String(r.s).padStart(3,"0")+".mp3";const st=Math.max(0,r.t-3);stopAt=r.t+13;
  const go=()=>{audio.currentTime=st;audio.play().catch(()=>{});setPlay(r.id)};
  if(audio.dataset.src!==src){audio.dataset.src=src;audio.src=src;audio.addEventListener("loadedmetadata",go,{once:true});audio.load()}else go();
}
function render(){
  const L=document.getElementById("list");L.textContent="";
  const vis=ROWS.filter(r=>filter==="all"||(filter==="err"?marks[r.id]==="err":!marks[r.id]));
  const done=ROWS.filter(r=>marks[r.id]).length,errs=ROWS.filter(r=>marks[r.id]==="err").length;
  document.getElementById("count").textContent=`راجعت ${done} من ${ROWS.length} · غلط ${errs}`;
  if(!vis.length){const p=document.createElement("p");p.className="note";p.textContent=filter==="err"?"ما حددت أي غلط للحين.":"خلصت كل الأماكن.";L.append(p);return}
  for(const r of vis){
    const c=document.createElement("div");c.className="c "+(marks[r.id]||"");
    c.innerHTML=`<div class="top"><span class="ref"></span><span class="tm"></span><button class="play"></button></div>
<div><div class="lbl">نص الآية في المصحف</div><div class="q"></div></div>
<div><div class="lbl">اللي سمعته الأداة (تقريبي)</div><div class="h"></div></div>
<div class="acts"><button class="be">غلط</button><button class="bo">سليم</button></div>`;
    c.querySelector(".ref").textContent=`${r.n} · آية ${r.a}`;
    c.querySelector(".tm").textContent=`الدقيقة ${fmt(r.t)}`+(r.o.length?` · يشبه ${r.o.join("، ")}`:"");
    const pb=c.querySelector(".play");pb.dataset.id=r.id;pb.textContent=playing===r.id?"إيقاف":"اسمع";pb.onclick=()=>play(r);
    c.querySelector(".q").textContent=r.q;c.querySelector(".h").textContent=r.h;
    const be=c.querySelector(".be"),bo=c.querySelector(".bo");
    be.setAttribute("aria-pressed",marks[r.id]==="err");bo.setAttribute("aria-pressed",marks[r.id]==="ok");
    be.onclick=()=>mark(r.id,"err");bo.onclick=()=>mark(r.id,"ok");
    L.append(c);
  }
}
async function mark(id,v){
  if(marks[id]===v)delete marks[id];else marks[id]=v;save();render();
}

render();
document.getElementById("st").hidden=true;
document.getElementById("cp").onclick=async()=>{
