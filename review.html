<h1>مراجعة تلاوة محمد اللحيدان</h1>
<p class="sub">هذي الأماكن اللي الأداة تشك إن الشيخ قرأ فيها كلام من آية ثانية. اضغط «اسمع» يشغّل لك الآية كاملة، وبعدين اختر <b>غلط</b> أو <b>سليم</b>. اختياراتك تنحفظ في جهازك. إذا خلصت اضغط «انسخ الأغلاط» وأرسلها لي.</p>

<button id="cp" aria-pressed="false">انسخ الأغلاط</button>
</div>

ُ أَكْبَرُ مِنَ الْقَتْلِ ۗ وَلَا يَزَالُونَ يُقَاتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَنْ دِينِكُمْ إِنِ اسْتَطَاعُوا ۚ وَمَنْ يَرْتَدِدْ مِنْكُمْ عَنْ دِينِهِ فَيَمُتْ وَهُوَ كَافِرٌ فَأُولَٰئِكَ حَبِطَتْ أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ ۖ وَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ", "st": 4712.3, "en": 4767.18}, {"id": "2_16", "s": 2, "n": "البقرة", "a": 233, "t": 5240.2, "o": ["3:181", "3:183"], "q": "۞ وَالْوَالِدَاتُ يُرْضِعْنَ أَوْلَادَهُنَّ حَوْلَيْنِ كَامِلَيْنِ ۖ لِمَنْ أَرَادَ أَنْ يُتِمَّ الرَّضَاعَةَ ۚ وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ ۚ لَا تُكَلَّفُ نَفْسٌ إِلَّا وُسْعَهَا ۚ لَا تُضَارَّ وَالِدَةٌ بِوَلَدِهَا وَلَا مَوْلُودٌ لَهُ بِوَلَدِهِ ۚ وَعَلَى الْوَارِثِ مِثْلُ ذَٰلِكَ ۗ فَإِنْ أَرَادَا فِصَالًا عَنْ تَرَاضٍ مِنْهُمَا وَتَشَاوُرٍ فَلَا جُنَاحَ عَلَيْهِمَا ۗ وَإِنْ أَرَدْتُمْ أَنْ تَسْتَرْضِعُوا أَوْلَادَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ إِذَا سَلَّمْتُمْ مَا آتَيْتُمْ بِالْمَعْرُوفِ ۗ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ", "st": 5182.1, "en": 5244.7}, {"id": "2_17", "s": 2, "n": "البقرة", "a": 237, "t": 5393.6, "o": ["2:234", "2:271"], "q": "وَإِنْ طَلَّقْتُمُوهُنَّ مِنْ قَبْلِ أَنْ تَمَسُّوهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةً فَنِصْفُ مَا فَرَضْتُمْ إِلَّا أَنْ يَعْفُونَ أَوْ يَعْفُوَ الَّذِي بِيَدِهِ عُقْدَةُ النِّكَاحِ ۚ وَأَنْ تَعْفُوا أَقْرَبُ لِلتَّقْوَىٰ ۚ وَلَا تَنْسَوُا الْفَضْلَ بَيْنَكُمْ ۚ إِنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ", "st": 5358.32, "en": 5406.46}, {"id": "2_18", "s": 2, "n": "البقرة", "a": 240, "t": 5445.8, "o": ["33:55"], "q": "وَالَّذِينَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُونَ أَزْوَاجًا وَصِيَّةً لِأَزْوَاجِهِمْ مَتَاعًا إِلَى الْحَوْلِ غَيْرَ إِخْرَاجٍ ۚ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِي مَا فَعَلْنَ فِي أَنْفُسِهِنَّ مِنْ مَعْرُوفٍ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ", "st": 5429.94, "en": 5457.74}, {"id": "2_19", "s": 2, "n": "البقرة", "a": 245, "t": 5528.0, "o": ["41:21"], "q": "مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً ۚ وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ", "st": 5507.86, "en": 5546.94}, {"id": "2_20", "s": 2, "n": "البقرة", "a": 253, "t": 5787.6, "o": ["4:32", "16:71"], "q": "۞ تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ ۘ مِنْهُمْ مَنْ كَلَّمَ اللَّهُ ۖ وَرَفَعَ بَعْضَهُمْ دَرَجَاتٍ ۚ وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ وَأَيَّدْنَاهُ بِرُوحِ الْقُدُسِ ۗ وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلَ الَّذِينَ مِنْ بَعْدِهِمْ مِنْ بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَاتُ وَلَٰكِنِ اخْتَلَفُوا فَمِنْهُمْ مَنْ آمَنَ وَمِنْهُمْ مَنْ كَفَرَ ۚ وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلُوا وَلَٰكِنَّ اللَّهَ يَفْعَلُ مَا يُرِيدُ", "st": 5785.44, "en": 5832.24}, {"id": "2_21", "s": 2, "n": "البقرة", "a": 268, "t": 6339.3, "o": ["2:224", "2:256"], "q": "الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُمْ بِالْفَحْشَاءِ ۖ وَاللَّهُ يَعِدُكُمْ مَغْفِرَةً مِنْهُ وَفَضْلًا ۗ وَاللَّهُ وَاسِعٌ عَلِيمٌ", "st": 6325.84, "en": 6351.84}, {"id": "2_22", "s": 2, "n": "البقرة", "a": 283, "t": 6830.4, "o": ["2:194", "2:196"], "q": "۞ وَإِنْ كُنْتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَقْبُوضَةٌ ۖ فَإِنْ أَمِنَ بَعْضُكُمْ بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللَّهَ رَبَّهُ ۗ وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَنْ يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ", "st": 6800.76, "en": 6850.04}, {"id": "2_23", "s": 2, "n": "البقرة", "a": 283, "t": 6841.7, "o": ["8:47"], "q": "۞ وَإِنْ كُنْتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَقْبُوضَةٌ ۖ فَإِنْ أَمِنَ بَعْضُكُمْ بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللَّهَ رَبَّهُ ۗ وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَنْ يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ", "st": 6800.76, "en": 6850.04}, {"id": "3_0", "s": 3, "n": "آل", "a": 19, "t": 397.8, "o": ["7:129"], "q": "إِنَّ الدِّينَ عِنْدَ اللَّهِ الْإِسْلَامُ ۗ وَمَا اخْتَلَفَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِنْ بَعْدِ مَا جَاءَهُمُ الْعِلْمُ بَغْيًا بَيْنَهُمْ ۗ وَمَنْ يَكْفُرْ بِآيَاتِ اللَّهِ فَإِنَّ اللَّهَ سَرِيعُ الْحِسَابِ", "st": 385.76, "en": 413.26}, {"id": "3_1", "s": 3, "n": "آل", "a": 45, "t": 974.3, "o": ["24:19"], "q": "إِذْ قَالَتِ الْمَلَائِكَةُ يَا مَرْيَمُ إِنَّ اللَّهَ يُبَشِّرُكِ بِكَلِمَةٍ مِنْهُ اسْمُهُ الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ وَجِيهًا فِي الدُّنْيَا وَالْآخِرَةِ وَمِنَ الْمُقَرَّبِينَ", "st": 955.34, "en": 982.42}, {"id": "3_2", "s": 3, "n": "آل", "a": 66, "t": 1336.2, "o": ["4:109"], "q": "هَا أَنْتُمْ هَٰؤُلَاءِ حَاجَجْتُمْ فِيمَا لَكُمْ بِهِ عِلْمٌ فَلِمَ تُحَاجُّونَ فِيمَا لَيْسَ لَكُمْ بِهِ عِلْمٌ ۚ وَاللَّهُ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ", "st": 1335.82, "en": 1358.58}, {"id": "3_3", "s": 3, "n": "آل", "a": 77, "t": 1551.6, "o": ["2:174"], "q": "إِنَّ الَّذِينَ يَشْتَرُونَ بِعَهْدِ اللَّهِ وَأَيْمَانِهِمْ ثَمَنًا قَلِيلًا أُولَٰئِكَ لَا خَلَاقَ لَهُمْ فِي الْآخِرَةِ وَلَا يُكَلِّمُهُمُ اللَّهُ وَلَا يَنْظُرُ إِلَيْهِمْ يَوْمَ الْقِيَامَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ", "st": 1545.16, "en": 1573.38}, {"id": "3_4", "s": 3, "n": "آل", "a": 81, "t": 1672.3, "o": ["3:52"], "q": "وَإِذْ أَخَذَ اللَّهُ مِيثَاقَ النَّبِيِّينَ لَمَا آتَيْتُكُمْ مِنْ كِتَابٍ وَحِكْمَةٍ ثُمَّ جَاءَكُمْ رَسُولٌ مُصَدِّقٌ لِمَا مَعَكُمْ لَتُؤْمِنُنَّ بِهِ وَلَتَنْصُرُنَّهُ ۚ قَالَ أَأَقْرَرْتُمْ وَأَخَذْتُمْ عَلَىٰ ذَٰلِكُمْ إِصْرِي ۖ قَالُوا أَقْرَرْنَا ۚ قَالَ فَاشْهَدُوا وَأَنَا مَعَكُمْ مِنَ الشَّاهِدِينَ", "st": 1644.22, "en": 1687.84}, {"id": "3_5", "s": 3, "n": "آل", "a": 82, "t": 1694.1, "o": ["59:19"], "q": "فَمَنْ تَوَلَّىٰ بَعْدَ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْفَاسِقُونَ", "st": 1687.84, "en": 1697.36}, {"id": "3_6", "s": 3, "n": "آل", "a": 86, "t": 1784.0, "o": ["5:51", "5:67"], "q": "كَيْفَ يَهْدِي اللَّهُ قَوْمًا كَفَرُوا بَعْدَ إِيمَانِهِمْ وَشَهِدُوا أَنَّ الرَّسُولَ حَقٌّ وَجَاءَهُمُ الْبَيِّنَاتُ ۚ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ", "st": 1767.8, "en": 1788.1}, {"id": "3_7", "s": 3, "n": "آل", "a": 103, "t": 2053.5, "o": ["5:7"], "q": "وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا ۚ وَاذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ إِذْ كُنْتُمْ أَعْدَاءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُمْ بِنِعْمَتِهِ إِخْوَانًا وَكُنْتُمْ عَلَىٰ شَفَا حُفْرَةٍ مِنَ النَّارِ فَأَنْقَذَكُمْ مِنْهَا ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَهْتَدُونَ", "st": 2047.92, "en": 2085.06}, {"id": "3_8", "s": 3, "n": "آل", "a": 112, "t": 2262.2, "o": ["2:61", "59:13"], "q": "ضُرِبَتْ عَلَيْهِمُ الذِّلَّةُ أَيْنَ مَا ثُقِفُوا إِلَّا بِحَبْلٍ مِنَ اللَّهِ وَحَبْلٍ مِنَ النَّاسِ وَبَاءُوا بِغَضَبٍ مِنَ اللَّهِ وَضُرِبَتْ عَلَيْهِمُ الْمَسْكَنَةُ ۚ ذَٰلِكَ بِأَنَّهُمْ كَانُوا يَكْفُرُونَ بِآيَاتِ اللَّهِ وَيَقْتُلُونَ الْأَنْبِيَاءَ بِغَيْرِ حَقٍّ ۚ ذَٰلِكَ بِمَا عَصَوْا وَكَانُوا يَعْتَدُونَ", "st": 2247.86, "en": 2332.48}, {"id": "3_9", "s": 3, "n": "آل", "a": 113, "t": 2343.9, "o": ["18:17"], "q": "۞ لَيْسُوا سَوَاءً ۗ مِنْ أَهْلِ الْكِتَابِ أُمَّةٌ قَائِمَةٌ يَتْلُونَ آيَاتِ اللَّهِ آنَاءَ اللَّيْلِ وَهُمْ يَسْجُدُونَ", "st": 2332.48, "en": 2365.54}, {"id": "3_10", "s": 3, "n": "آل", "a": 152, "t": 3099.0, "o": ["3:155"], "q": "وَلَقَدْ صَدَقَكُمُ اللَّهُ وَعْدَهُ إِذْ تَحُسُّونَهُمْ بِإِذْنِهِ ۖ حَتَّىٰ إِذَا فَشِلْتُمْ وَتَنَازَعْتُمْ فِي الْأَمْرِ وَعَصَيْتُمْ مِنْ بَعْدِ مَا أَرَاكُمْ مَا تُحِبُّونَ ۚ مِنْكُمْ مَنْ يُرِيدُ الدُّنْيَا وَمِنْكُمْ مَنْ يُرِيدُ الْآخِرَةَ ۚ ثُمَّ صَرَفَكُمْ عَنْهُمْ لِيَبْتَلِيَكُمْ ۖ وَلَقَدْ عَفَا عَنْكُمْ ۗ وَاللَّهُ ذُو فَضْلٍ عَلَى الْمُؤْمِنِينَ", "st": 3063.84, "en": 3111.16}, {"id": "3_11", "s": 3, "n": "آل", "a": 180, "t": 3848.2, "o": ["3:112"], "q": "وَلَا يَحْسَبَنَّ الَّذِينَ يَبْخَلُونَ بِمَا آتَاهُمُ اللَّهُ مِنْ فَضْلِهِ هُوَ خَيْرًا لَهُمْ ۖ بَلْ هُوَ شَرٌّ لَهُمْ ۖ سَيُطَوَّقُونَ مَا بَخِلُوا بِهِ يَوْمَ الْقِيَامَةِ ۗ وَلِلَّهِ مِيرَاثُ السَّمَاوَاتِ وَالْأَرْضِ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ", "st": 3801.02, "en": 3853.66}, {"id": "3_12", "s": 3, "n": "آل", "a": 188, "t": 4004.1, "o": ["3:178", "3:180"], "q": "لَا تَحْسَبَنَّ الَّذِينَ يَفْرَحُونَ بِمَا أَتَوْا وَيُحِبُّونَ أَنْ يُحْمَدُوا بِمَا لَمْ يَفْعَلُوا فَلَا تَحْسَبَنَّهُمْ بِمَفَازَةٍ مِنَ الْعَذَابِ ۖ وَلَهُمْ عَذَابٌ أَلِيمٌ", "st": 4004.12, "en": 4036.58}, {"id": "3_13", "s": 3, "n": "آل", "a": 190, "t": 4050.9, "o": ["6:13"], "q": "إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِأُولِي الْأَلْبَابِ", "st": 4046.38, "en": 4072.26}, {"id": "3_14", "s": 3, "n": "آل", "a": 198, "t": 4285.5, "o": ["6:6", "43:51"], "q": "لَٰكِنِ الَّذِينَ اتَّقَوْا رَبَّهُمْ لَهُمْ جَنَّاتٌ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا نُزُلًا مِنْ عِنْدِ اللَّهِ ۗ وَمَا عِنْدَ اللَّهِ خَيْرٌ لِلْأَبْرَارِ", "st": 4277.2, "en": 4301.2}, {"id": "3_15", "s": 3, "n": "آل", "a": 199, "t": 4327.0, "o": ["2:181", "2:244"], "q": "وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَنْ يُؤْمِنُ بِاللَّهِ وَمَا أُنْزِلَ إِلَيْكُمْ وَمَا أُنْزِلَ إِلَيْهِمْ خَاشِعِينَ لِلَّهِ لَا يَشْتَرُونَ بِآيَاتِ اللَّهِ ثَمَنًا قَلِيلًا ۗ أُولَٰئِكَ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ ۗ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ", "st": 4301.2, "en": 4334.68}, {"id": "4_0", "s": 4, "n": "عمران", "a": 11, "t": 264.8, "o": ["2:247", "2:249"], "q": "يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ ۚ فَإِنْ كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِنْ كَانَتْ وَاحِدَةً فَلَهَا النِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِنْ كَانَ لَهُ وَلَدٌ ۚ فَإِنْ لَمْ يَكُنْ لَهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ ۚ فَإِنْ كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ ۚ مِنْ بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ ۗ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًا ۚ فَرِيضَةً مِنَ اللَّهِ ۗ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا", "st": 202.44, "en": 272.62}, {"id": "4_1", "s": 4, "n": "عمران", "a": 17, "t": 485.1, "o": ["9:102", "33:24"], "q": "إِنَّمَا التَّوْبَةُ عَلَى اللَّهِ لِلَّذِينَ يَعْمَلُونَ السُّوءَ بِجَهَالَةٍ ثُمَّ يَتُوبُونَ مِنْ قَرِيبٍ فَأُولَٰئِكَ يَتُوبُ اللَّهُ عَلَيْهِمْ ۗ وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا", "st": 449.5, "en": 494.38}, {"id": "4_2", "s": 4, "n": "عمران", "a": 32, "t": 923.8, "o": ["13:4", "16:71"], "q": "وَلَا تَتَمَنَّوْا مَا فَضَّلَ اللَّهُ بِهِ بَعْضَكُمْ عَلَىٰ بَعْضٍ ۚ لِلرِّجَالِ نَصِيبٌ مِمَّا اكْتَسَبُوا ۖ وَلِلنِّسَاءِ نَصِيبٌ مِمَّا اكْتَسَبْنَ ۚ وَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ ۗ إِنَّ اللَّهَ كَانَ بِكُلِّ شَيْءٍ عَلِيمًا", "st": 919.16, "en": 942.2}, {"id": "4_3", "s": 4, "n": "عمران", "a": 33, "t": 945.1, "o": ["2:248"], "q": "وَلِكُلٍّ جَعَلْنَا مَوَالِيَ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ ۚ وَالَّذِينَ عَقَدَتْ أَيْمَانُكُمْ فَآتُوهُمْ نَصِيبَهُمْ ۚ إِنَّ اللَّهَ كَانَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدًا", "st": 942.2, "en": 961.72}, {"id": "4_4", "s": 4, "n": "عمران", "a": 36, "t": 1046.3, "o": ["8:41"], "q": "۞ وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا ۖ وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ وَابْنِ السَّبِيلِ وَمَا مَلَكَتْ أَيْمَانُكُمْ ۗ إِنَّ اللَّهَ لَا يُحِبُّ مَنْ كَانَ مُخْتَالًا فَخُورًا", "st": 1024.98, "en": 1064.7}, {"id": "4_5", "s": 4, "n": "عمران", "a": 43, "t": 1202.9, "o": ["2:283"], "q": "يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقْرَبُوا الصَّلَاةَ وَأَنْتُمْ سُكَارَىٰ حَتَّىٰ تَعْلَمُوا مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِي سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا ۚ وَإِنْ كُنْتُمْ مَرْضَىٰ أَوْ عَلَىٰ سَفَرٍ أَوْ جَاءَ أَحَدٌ مِنْكُمْ مِنَ الْغَائِطِ أَوْ لَامَسْتُمُ النِّسَاءَ فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ ۗ إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا", "st": 1181.42, "en": 1243.36}, {"id": "4_6", "s": 4, "n": "عمران", "a": 57, "t": 1509.1, "o": ["6:6", "43:51"], "q": "وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَنُدْخِلُهُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۖ لَهُمْ فِيهَا أَزْوَاجٌ مُطَهَّرَةٌ ۖ وَنُدْ 6"], "q": "يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِنْدَ رَبِّي ۖ لَا يُجَلِّيهَا لِوَقْتِهَا إِلَّا هُوَ ۚ ثَقُلَتْ فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ لَا تَأْتِيكُمْ إِلَّا بَغْتَةً ۗ يَسْأَلُونَكَ كَأَنَّكَ حَفِيٌّ عَنْهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِنْدَ اللَّهِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ", "st": 3386.9, "en": 3437.04}, {"id": "7_12", "s": 7, "n": "الأنعام", "a": 189, "t": 3468.2, "o": ["35:39"], "q": "۞ هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ وَجَعَلَ مِنْهَا زَوْجَهَا لِيَسْكُنَ إِلَيْهَا ۖ فَلَمَّا تَغَشَّاهَا حَمَلَتْ حَمْلًا خَفِيفًا فَمَرَّتْ بِهِ ۖ فَلَمَّا أَثْقَلَتْ دَعَوَا اللَّهَ رَبَّهُمَا لَئِنْ آتَيْتَنَا صَالِحًا لَنَكُونَنَّ مِنَ الشَّاكِرِينَ", "st": 3468.3, "en": 3499.02}, {"id": "8_0", "s": 8, "n": "الأعراف", "a": 6, "t": 66.3, "o": ["2:109", "4:115"], "q": "يُجَادِلُونَكَ فِي الْحَقِّ بَعْدَمَا تَبَيَّنَ كَأَنَّمَا يُسَاقُونَ إِلَى الْمَوْتِ وَهُمْ يَنْظُرُونَ", "st": 64.3, "en": 73.44}, {"id": "8_1", "s": 8, "n": "الأعراف", "a": 19, "t": 299.3, "o": ["9:3"], "q": "إِنْ تَسْتَفْتِحُوا فَقَدْ جَاءَكُمُ الْفَتْحُ ۖ وَإِنْ تَنْتَهُوا فَهُوَ خَيْرٌ لَكُمْ ۖ وَإِنْ تَعُودُوا نَعُدْ وَلَنْ تُغْنِيَ عَنْكُمْ فِئَتُكُمْ شَيْئًا وَلَوْ كَثُرَتْ وَأَنَّ اللَّهَ مَعَ الْمُؤْمِنِينَ", "st": 277.36, "en": 319.16}, {"id": "8_2", "s": 8, "n": "الأعراف", "a": 28, "t": 460.7, "o": ["33:29"], "q": "وَاعْلَمُوا أَنَّمَا أَمْوَالُكُمْ وَأَوْلَادُكُمْ فِتْنَةٌ وَأَنَّ اللَّهَ عِنْدَهُ أَجْرٌ عَظِيمٌ", "st": 452.22, "en": 462.92}, {"id": "8_3", "s": 8, "n": "الأعراف", "a": 41, "t": 718.5, "o": ["2:234", "2:265"], "q": "۞ وَاعْلَمُوا أَنَّمَا غَنِمْتُمْ مِنْ شَيْءٍ فَأَنَّ لِلَّهِ خُمُسَهُ وَلِلرَّسُولِ وَلِذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَابْنِ السَّبِيلِ إِنْ كُنْتُمْ آمَنْتُمْ بِاللَّهِ وَمَا أَنْزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ الْفُرْقَانِ يَوْمَ الْتَقَى الْجَمْعَانِ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "st": 667.76, "en": 728.4}, {"id": "8_4", "s": 8, "n": "الأعراف", "a": 53, "t": , {"id": "9_1", "s": 9, "n": "الأنفال", "a": 20, "t": 465.1, "o": ["57:10"], "q": "الَّذِينَ آمَنُوا وَهَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ أَعْظَمُ دَرَجَةً عِنْدَ اللَّهِ ۚ وَأُولَٰئِكَ هُمُ الْفَائِزُونَ", "st": 452.58, "en": 480.24}, {"id": "9_2", "s": 9, "n": "الأنفال", "a": 27, "t": 505.2, "o": ["9:21"], "q": "ثُمَّ يَتُوبُ اللَّهُ مِنْ بَعْدِ ذَٰلِكَ عَلَىٰ مَنْ يَشَاءُ ۗ وَاللَّهُ غَفُورٌ رَحِيمٌ", "st": 505.52, "en": 505.84}, {"id": "9_3", "s": 9, "n": "الأنفال", "a": 61, "t": 1091.4, "o": ["2:10", "2:174"], "q": "وَمِنْهُمُ الَّذِينَ يُؤْذُونَ النَّبِيَّ وَيَقُولُونَ هُوَ أُذُنٌ ۚ قُلْ أُذُنُ خَيْرٍ لَكُمْ يُؤْمِنُ بِاللَّهِ وَيُؤْمِنُ لِلْمُؤْمِنِينَ وَرَحْمَةٌ لِلَّذِينَ آمَنُوا مِنْكُمْ ۚ وَالَّذِينَ يُؤْذُونَ رَسُولَ اللَّهِ لَهُمْ عَذَابٌ أَلِيمٌ", "st": 1060.06, "en": 1094.12}, {"id": "9_4", "s": 9, "n": "الأنفال", "a": 62, "t": 1102.2, "o": ["52:34", "68:41"], "q": "يَحْلِفُونَ بِاللَّهِ لَكُمْ لِيُرْضُوكُمْ وَاللَّهُ وَرَسُولُهُ أَحَقُّ أَنْ يُرْضُوهُ إِنْ كَانُوا مُؤْمِنِينَ", "st": 1094.12, "en": 1111.08}, {"id": "9_5", "s": 9, "n": "الأنفال", "a": 72, "t": 1372.7, "o": ["9:109", "57:20"], "q": "وَعَدَ اللَّهُ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَمَسَاكِنَ طَيِّبَةً فِي جَنَّاتِ عَدْنٍ ۚ وَرِضْوَانٌ مِنَ اللَّهِ أَكْبَرُ ۚ ذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ", "st": 1345.62, "en": 1384.8}, {"id": "9_6", "s": 9, "n": "الأنفال", "a": 85, "t": 1658.8, "o": ["8:7"], "q": "وَلَا تُعْجِبْكَ أَمْوَالُهُمْ وَأَوْلَادُهُمْ ۚ إِنَّمَا يُرِيدُ اللَّهُ أَنْ يُعَذِّبَهُمْ بِهَا فِي الدُّنْيَا وَتَزْهَقَ أَنْفُسُهُمْ وَهُمْ كَافِرُونَ", "st": 1653.74, "en": 1669.36}, {"id": "9_7", "s": 9, "n": "الأنفال", "a": 100, "t": 2015.0, "o": ["2:25", "3:15"], "q": "وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ وَالَّذِينَ اتَّبَعُوهُمْ بِإِحْسَانٍ رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ وَأَعَدَّ لَهُمْ جَنَّاتٍ تَجْرِي تَحْتَهَا الْأَنْهَارُ خَالِدِينَ فِيه 8, "o": ["6:62"], "q": "هُنَالِكَ تَبْلُو كُلُّ نَفْسٍ مَا أَسْلَفَتْ ۚ وَرُدُّوا إِلَى اللَّهِ مَوْلَاهُمُ الْحَقِّ ۖ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ", "st": 699.96, "en": 727.24}, {"id": "10_3", "s": 10, "n": "التوبة", "a": 46, "t": 972.4, "o": ["13:40"], "q": "وَإِمَّا نُرِيَنَّكَ بَعْضَ الَّذِي نَعِدُهُمْ أَوْ نَتَوَفَّيَنَّكَ فَإِلَيْنَا مَرْجِعُهُمْ ثُمَّ اللَّهُ شَهِيدٌ عَلَىٰ مَا يَفْعَلُونَ", "st": 972.46, "en": 986.76}, {"id": "10_4", "s": 10, "n": "التوبة", "a": 47, "t": 999.7, "o": ["39:69"], "q": "وَلِكُلِّ أُمَّةٍ رَسُولٌ ۖ فَإِذَا جَاءَ رَسُولُهُمْ قُضِيَ بَيْنَهُمْ بِالْقِسْطِ وَهُمْ لَا يُظْلَمُونَ", "st": 986.76, "en": 1004.48}, {"id": "10_5", "s": 10, "n": "التوبة", "a": 60, "t": 1216.2, "o": ["22:73"], "q": "وَمَا ظَنُّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ يَوْمَ الْقِيَامَةِ ۗ إِنَّ اللَّهَ لَذُو فَضْلٍ عَلَى النَّاسِ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَ", "st": 1215.12, "en": 1230.78}, {"id": "10_6", "s": 10, "n": "التوبة", "a": 61, "t": 1262.1, "o": ["29:22"], "q": "وَمَا تَكُونُ فِي شَأْنٍ وَمَا تَتْلُو مِنْهُ مِنْ قُرْآنٍ وَلَا تَعْمَلُونَ مِنْ عَمَلٍ إِلَّا كُنَّا عَلَيْكُمْ شُهُودًا إِذْ تُفِيضُونَ فِيهِ ۚ وَمَا يَعْزُبُ عَنْ رَبِّكَ مِنْ مِثْقَالِ ذَرَّةٍ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَلَا أَصْغَرَ مِنْ ذَٰلِكَ وَلَا أَكْبَرَ إِلَّا فِي كِتَابٍ مُبِينٍ", "st": 1230.78, "en": 1292.28}, {"id": "10_7", "s": 10, "n": "التوبة", "a": 73, "t": 1495.2, "o": ["6:39", "6:49"], "q": "فَكَذَّبُوهُ فَنَجَّيْنَاهُ وَمَنْ مَعَهُ فِي الْفُلْكِ وَجَعَلْنَاهُمْ خَلَائِفَ وَأَغْرَقْنَا الَّذِينَ كَذَّبُوا بِآيَاتِنَا ۖ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُنْذَرِينَ", "st": 1482.76, "en": 1502.98}, {"id": "10_8", "s": 10, "n": "التوبة", "a": 78, "t": 1570.9, "o": ["5:104", "31:21"], "q": "قَالُوا أَجِئْتَنَا لِتَلْفِتَنَا عَمَّا وَجَدْنَا عَلَيْهِ آبَاءَنَا وَتَكُونَ لَكُمَا الْكِبْرِيَاءُ فِي الْأَرْضِ وَمَا نَحْنُ لَكُمَا بِمُؤْمِنِينَ", "st": 1568.04, "en": 1584.82}, {"id": "10_9", "s": 10, "n": "التوبة", "a": 93, "t": 1811.0, ": 1039.64}, {"id": "17_3", "s": 17, "n": "النحل", "a": 97, "t": 1502.0, "o": ["4:52", "4:88"], "q": "وَمَنْ يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ ۖ وَمَنْ يُضْلِلْ فَلَنْ تَجِدَ لَهُمْ أَوْلِيَاءَ مِنْ دُونِهِ ۖ وَنَحْشُرُهُمْ يَوْمَ الْقِيَامَةِ عَلَىٰ وُجُوهِهِمْ عُمْيًا وَبُكْمًا وَصُمًّا ۖ مَأْوَاهُمْ جَهَنَّمُ ۖ كُلَّمَا خَبَتْ زِدْنَاهُمْ سَعِيرًا", "st": 1496.8, "en": 1544.58}, {"id": "17_4", "s": 17, "n": "النحل", "a": 98, "t": 1548.9, "o": ["3:4", "8:52"], "q": "ذَٰلِكَ جَزَاؤُهُمْ بِأَنَّهُمْ كَفَرُوا بِآيَاتِنَا وَقَالُوا أَإِذَا كُنَّا عِظَامًا وَرُفَاتًا أَإِنَّا لَمَبْعُوثُونَ خَلْقًا جَدِيدًا", "st": 1544.58, "en": 1583.52}, {"id": "19_0", "s": 19, "n": "الكهف", "a": 9, "t": 87.4, "o": ["19:67"], "q": "قَالَ كَذَٰلِكَ قَالَ رَبُّكَ هُوَ عَلَيَّ هَيِّنٌ وَقَدْ خَلَقْتُكَ مِنْ قَبْلُ وَلَمْ تَكُ شَيْئًا", "st": 80.5, "en": 99.26}, {"id": "20_0", "s": 20, "n": "مريم", "a": 47, "t": 294.7, "o": ["5:32", "7:137"], "q": "فَأْتِيَاهُ فَقُولَا إِنَّا رَسُولَا رَبِّكَ فَأَرْسِلْ مَعَنَا بَنِي إِسْرَائِيلَ وَلَا تُعَذِّبْهُمْ ۖ قَدْ جِئْنَاكَ بِآيَةٍ مِنْ رَبِّكَ ۖ وَالسَّلَامُ عَلَىٰ مَنِ اتَّبَعَ الْهُدَىٰ", "st": 289.18, "en": 307.32}, {"id": "20_1", "s": 20, "n": "مريم", "a": 65, "t": 483.9, "o": ["7:115"], "q": "قَالُوا يَا مُوسَىٰ إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُونَ أَوَّلَ مَنْ أَلْقَىٰ", "st": 478.56, "en": 491.88}, {"id": "20_2", "s": 20, "n": "مريم", "a": 97, "t": 866.1, "o": ["18:110", "21:108"], "q": "قَالَ فَاذْهَبْ فَإِنَّ لَكَ فِي الْحَيَاةِ أَنْ تَقُولَ لَا مِسَاسَ ۖ وَإِنَّ لَكَ مَوْعِدًا لَنْ تُخْلَفَهُ ۖ وَانْظُرْ إِلَىٰ إِلَٰهِكَ الَّذِي ظَلْتَ عَلَيْهِ عَاكِفًا ۖ لَنُحَرِّقَنَّهُ ثُمَّ لَنَنْسِفَنَّهُ فِي الْيَمِّ نَسْفًا", "st": 838.34, "en": 877.36}, {"id": "21_0", "s": 21, "n": "طه", "a": 31, "t": 311.6, "o": ["16:15", "31:10"], "q": "وَجَعَلْنَا فِي الْأَرْضِ رَوَاسِيَ أَنْ تَمِيدَ بِهِمْ وَجَعَلْنَا فِيهَا فِجَاجًا سُبُلًا لَعَلَّهُمْ يَهْتَدُونَ", "st": 309.04, "en": 333.24}, {"id": "21_1", "s": 21, "n": "طه", "a": 31, "t": 328.9, "o": ["43:10"], "q": "وَجَعَلْنَا فِي الْأَرْضِ رَوَاسِيَ أَنْ تَمِيدَ بِهِمْ وَجَعَلْنَا فِيهَا فِجَاجًا سُبُلًا لَعَلَّهُمْ يَهْتَدُونَ", "st": 309.04, "en": 333.24}, {"id": "21_2", "s": 21, "n": "طه", "a": 45, "t": 564.0, "o": ["12:107", "14:21"], "q": "قُلْ إِنَّمَا أُنْذِرُكُمْ بِالْوَحْيِ ۚ وَلَا يَسْمَعُ الصُّمُّ الدُّعَاءَ إِذَا مَا يُنْذَرُونَ", "st": 548.66, "en": 572.26}, {"id": "21_3", "s": 21, "n": "طه", "a": 81, "t": 947.6, "o": ["2:29", "2:231"], "q": "وَلِسُلَيْمَانَ الرِّيحَ عَاصِفَةً تَجْرِي بِأَمْرِهِ إِلَى الْأَرْضِ الَّتِي بَارَكْنَا فِيهَا ۚ وَكُنَّا بِكُلِّ شَيْءٍ عَالِمِينَ", "st": 938.52, "en": 950.04}, {"id": "22_0", "s": 22, "n": "الأنبياء", "a": 17, "t": 280.7, "o": ["5:117", "85:9"], "q": "إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا وَالصَّابِئِينَ وَالنَّصَارَىٰ وَالْمَجُوسَ وَالَّذِينَ أَشْرَكُوا إِنَّ اللَّهَ يَفْصِلُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ", "st": 256.76, "en": 304.12}, {"id": "22_1", "s": 22, "n": "الأنبياء", "a": 18, "t": 332.5, "o": ["17:97", "39:37"], "q": "أَلَمْ تَرَ أَنَّ اللَّهَ يَسْجُدُ لَهُ مَنْ فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ وَالشَّمْسُ وَالْقَمَرُ وَالنُّجُومُ وَالْجِبَالُ وَالشَّجَرُ وَالدَّوَابُّ وَكَثِيرٌ مِنَ النَّاسِ ۖ وَكَثِيرٌ حَقَّ عَلَيْهِ الْعَذَابُ ۗ وَمَنْ يُهِنِ اللَّهُ فَمَا لَهُ مِنْ مُكْرِمٍ ۚ إِنَّ اللَّهَ يَفْعَلُ مَا يَشَاءُ ۩", "st": 304.12, "en": 346.32}, {"id": "22_2", "s": 22, "n": "الأنبياء", "a": 33, "t": 580.8, "o": ["22:67"], "q": "لَكُمْ فِيهَا مَنَافِعُ إِلَىٰ أَجَلٍ مُسَمًّى ثُمَّ مَحِلُّهَا إِلَى الْبَيْتِ الْعَتِيقِ", "st": 569.24, "en": 584.2}, {"id": "22_3", "s": 22, "n": "الأنبياء", "a": 36, "t": 628.3, "o": ["7:59", "7:65"], "q": "وَالْبُدْنَ جَعَلْنَاهَا لَكُمْ مِنْ شَعَائِرِ اللَّهِ لَكُمْ فِيهَا خَيْرٌ ۖ فَاذْكُرُوا اسْمَ اللَّهِ عَلَيْهَا صَوَافَّ ۖ فَإِذَا وَجَبَتْ جُنُوبُهَا فَكُلُوا مِنْهَا وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ ۚ كَذَٰلِكَ سَخَّرْنَاهَا لَكُمْ لَعَلَّكُمْ تَشْكُرُونَ", "st": 626.74, "en": 652.96}, {"id": "22_4", "s": 22, "n": "الأنبياء", "a": 61, "t": 1042.7, "o": ["31:29"], "q": "ذَٰلِكَ بِأَنَّ اللَّهَ يُولِجُ اللَّيْلَ فِي النَّهَارِ وَيُولِجُ النَّهَارَ فِي اللَّيْلِ وَأَنَّ اللَّهَ سَمِيعٌ بَصِيرٌ", "st": 1034.38, "en": 1053.02}, {"id": "22_5", "s": 22, "n": "الأنبياء", "a": 62, "t": 1062.2, "o": ["8:62"], "q": "ذَٰلِكَ بِأَنَّ اللَّهَ هُوَ الْحَقُّ وَأَنَّ مَا يَدْعُونَ مِنْ دُونِهِ هُوَ الْبَاطِلُ وَأَنَّ اللَّهَ هُوَ الْعَلِيُّ الْكَبِيرُ", "st": 1053.02, "en": 1065.3}, {"id": "22_6", "s": 22, "n": "الأنبياء", "a": 72, "t": 1225.6, "o": ["57:15"], "q": "وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا بَيِّنَاتٍ تَعْرِفُ فِي وُجُوهِ الَّذِينَ كَفَرُوا الْمُنْكَرَ ۖ يَكَادُونَ يَسْطُونَ بِالَّذِينَ يَتْلُونَ عَلَيْهِمْ آيَاتِنَا ۗ قُلْ أَفَأُنَبِّئُكُمْ بِشَرٍّ مِنْ ذَٰلِكُمُ ۗ النَّارُ وَعَدَهَا اللَّهُ الَّذِينَ كَفَرُوا ۖ وَبِئْسَ الْمَصِيرُ", "st": 1177.18, "en": 1232.56}, {"id": "24_0", "s": 24, "n": "المؤمنون", "a": 7, "t": 103.9, "o": ["7:44"], "q": "وَالْخَامِسَةُ أَنَّ لَعْنَتَ اللَّهِ عَلَيْهِ إِنْ كَانَ مِنَ الْكَاذِبِينَ", "st": 102.74, "en": 110.0}, {"id": "24_1", "s": 24, "n": "المؤمنون", "a": 21, "t": 321.3, "o": ["14:4", "28:56"], "q": "۞ يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ وَمَنْ يَتَّبِعْ خُطُوَاتِ الشَّيْطَانِ فَإِنَّهُ يَأْمُرُ بِالْفَحْشَاءِ وَالْمُنْكَرِ ۚ وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ مَا زَكَىٰ مِنْكُمْ مِنْ أَحَدٍ أَبَدًا وَلَٰكِنَّ اللَّهَ يُزَكِّي مَنْ يَشَاءُ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ", "st": 296.38, "en": 330.44}, {"id": "24_2", "s": 24, "n": "المؤمنون", "a": 58, "t": 1165.7, "o": ["2:198", "24:29"], "q": "يَا أَيُّهَا الَّذِينَ آمَنُوا لِيَسْتَأْذِنْكُمُ الَّذِينَ مَلَكَتْ أَيْمَانُكُمْ وَالَّذِينَ لَمْ يَبْلُغُوا الْحُلُمَ مِنْكُمْ ثَلَاثَ مَرَّاتٍ ۚ مِنْ قَبْلِ صَلَاةِ الْفَجْرِ وَحِينَ تَضَعُونَ ثِيَابَكُمْ مِنَ الظَّهِيرَةِ وَمِنْ بَعْدِ صَلَاةِ الْعِشَاءِ ۚ ثَلَاثُ عَوْرَاتٍ لَكُمْ ۚ لَيْسَ عَلَيْكُمْ وَلَا عَلَيْهِمْ جُنَاحٌ بَعْدَهُنَّ ۚ طَوَّافُونَ عَلَيْكُمْ بَعْضُكُمْ عَل حم", "st": 0, "en": 11.6}, {"id": "42_1", "s": 42, "n": "فصلت", "a": 23, "t": 479.6, "o": ["12:40", "63:8"], "q": "ذَٰلِكَ الَّذِي يُبَشِّرُ اللَّهُ عِبَادَهُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ ۗ قُلْ لَا أَسْأَلُكُمْ عَلَيْهِ أَجْرًا إِلَّا الْمَوَدَّةَ فِي الْقُرْبَىٰ ۗ وَمَنْ يَقْتَرِفْ حَسَنَةً نَزِدْ لَهُ فِيهَا حُسْنًا ۚ إِنَّ اللَّهَ غَفُورٌ شَكُورٌ", "st": 469.12, "en": 501.68}, {"id": "42_2", "s": 42, "n": "فصلت", "a": 27, "t": 569.3, "o": ["3:5", "6:38"], "q": "۞ وَلَوْ بَسَطَ اللَّهُ الرِّزْقَ لِعِبَادِهِ لَبَغَوْا فِي الْأَرْضِ وَلَٰكِنْ يُنَزِّلُ بِقَدَرٍ مَا يَشَاءُ ۚ إِنَّهُ بِعِبَادِهِ خَبِيرٌ بَصِيرٌ", "st": 564.18, "en": 588.9}, {"id": "42_3", "s": 42, "n": "فصلت", "a": 52, "t": 970.4, "o": ["12:56", "12:110"], "q": "وَكَذَٰلِكَ أَوْحَيْنَا إِلَيْكَ رُوحًا مِنْ أَمْرِنَا ۚ مَا كُنْتَ تَدْرِي مَا الْكِتَابُ وَلَا الْإِيمَانُ وَلَٰكِنْ جَعَلْنَاهُ نُورًا نَهْدِي بِهِ مَنْ نَشَاءُ مِنْ عِبَادِنَا ۚ وَإِنَّكَ لَتَهْدِي إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ", "st": 951.6, "en": 981.16}, {"id": "43_0", "s": 43, "n": "الشورى", "a": 35, "t": 429.8, "o": ["18:28", "31:33"], "q": "وَزُخْرُفًا ۚ وَإِنْ كُلُّ ذَٰلِكَ لَمَّا مَتَاعُ الْحَيَاةِ الدُّنْيَا ۚ وَالْآخِرَةُ عِنْدَ رَبِّكَ لِلْمُتَّقِينَ", "st": 424.66, "en": 439.74}, {"id": "45_0", "s": 45, "n": "الدخان", "a": 1, "t": 2.4, "o": ["3:36", "16:98"], "q": "حم", "st": 0, "en": 11.4}, {"id": "45_1", "s": 45, "n": "الدخان", "a": 1, "t": 5.5, "o": ["1:1", "27:30"], "q": "حم", "st": 0, "en": 11.4}, {"id": "45_2", "s": 45, "n": "الدخان", "a": 21, "t": 306.8, "o": ["3:100", "3:149"], "q": "أَمْ حَسِبَ الَّذِينَ اجْتَرَحُوا السَّيِّئَاتِ أَنْ نَجْعَلَهُمْ كَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَوَاءً مَحْيَاهُمْ وَمَمَاتُهُمْ ۚ سَاءَ مَا يَحْكُمُونَ", "st": 298.68, "en": 324.68}, {"id": "45_3", "s": 45, "n": "الدخان", "a": 26, "t": 426.7, "o": ["12:103"], "q": "قُلِ اللَّهُ يُحْيِيكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يَجْمَعُكُمْ إِلَىٰ يَوْمِ الْقِيَامَةِ لَا رَيْبَ فِيهِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ", "st": 414.88, "en": 430.82}, {"id": "45_4", "s": 45, "n": "الدخان", "a": 37, "t": 596.9, "o": ["46:2"], "q": "وَلَهُ الْكِبْرِيَاءُ فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ", "st": 589.44, "en": null}, {"id": "46_0", "s": 46, "n": "الجاثية", "a": 15, "t": 242.7, "o": ["29:8"], "q": "وَوَصَّيْنَا الْإِنْسَانَ بِوَالِدَيْهِ إِحْسَانًا ۖ حَمَلَتْهُ أُمُّهُ كُرْهًا وَوَضَعَتْهُ كُرْهًا ۖ وَحَمْلُهُ وَفِصَالُهُ ثَلَاثُونَ شَهْرًا ۚ حَتَّىٰ إِذَا بَلَغَ أَشُدَّهُ وَبَلَغَ أَرْبَعِينَ سَنَةً قَالَ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ", "st": 241.68, "en": 293.12}, {"id": "46_1", "s": 46, "n": "الجاثية", "a": 26, "t": 516.6, "o": ["12:67", "36:15"], "q": "وَلَقَدْ مَكَّنَّاهُمْ فِيمَا إِنْ مَكَّنَّاكُمْ فِيهِ وَجَعَلْنَا لَهُمْ سَمْعًا وَأَبْصَارًا وَأَفْئِدَةً فَمَا أَغْنَىٰ عَنْهُمْ سَمْعُهُمْ وَلَا أَبْصَارُهُمْ وَلَا أَفْئِدَتُهُمْ مِنْ شَيْءٍ إِذْ كَانُوا يَجْحَدُونَ بِآيَاتِ اللَّهِ وَحَاقَ بِهِمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ", "st": 493.62, "en": 529.64}, {"id": "46_2", "s": 46, "n": "الجاثية", "a": 30, "t": 589.7, "o": ["3:50", "61:6"], "q": "قَالُوا يَا قَوْمَنَا إِنَّا سَمِعْنَا كِتَابًا أُنْزِلَ مِنْ بَعْدِ مُوسَىٰ مُصَدِّقًا لِمَا بَيْنَ يَدَيْهِ يَهْدِي إِلَى الْحَقِّ وَإِلَىٰ طَرِيقٍ مُسْتَقِيمٍ", "st": 579.68, "en": 598.82}, {"id": "47_0", "s": 47, "n": "الأحقاف", "a": 1, "t": 0.0, "o": ["1:1", "27:30"], "q": "الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ أَضَلَّ أَعْمَالَهُمْ", "st": 0, "en": 9.32}, {"id": "47_1", "s": 47, "n": "الأحقاف", "a": 3, "t": 30.0, "o": ["2:62", "2:218"], "q": "ذَٰلِكَ بِأَنَّ الَّذِينَ كَفَرُوا اتَّبَعُوا الْبَاطِلَ وَأَنَّ الَّذِينَ آمَنُوا اتَّبَعُوا الْحَقَّ مِنْ رَبِّهِمْ ۚ كَذَٰلِكَ يَضْرِبُ اللَّهُ لِلنَّاسِ أَمْثَالَهُمْ", "st": 25.52, "en": 39.52}, {"id": "47_2", "s": 47, "n": "الأحقاف", "a": 4, "t": 78.4, "o": ["3:167"], const BASE="https://nawafz2011-blip.github.io/luhaidan/";
let marks={};try{marks=JSON.parse(localStorage.getItem("lh_marks")||"null")||{"36_0":"err"}}catch(e){marks={"36_0":"err"}}
let filter="todo",db=null;
function save(){try{localStorage.setItem("lh_marks",JSON.stringify(marks))}catch(e){}}
const audio=new Audio();let stopAt=0,playing=null;
audio.addEventListener("timeupdate",()=>{if(audio.currentTime>=stopAt){audio.pause();setPlay(null)}});
function fmt(t){t=Math.max(0,Math.round(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
function setPlay(id){playing=id;document.querySelectorAll(".play").forEach(b=>b.textContent=b.dataset.id===id?"إيقاف":"اسمع")}
function play(r){
  if(playing===r.id){audio.pause();setPlay(null);return}
  const src=BASE+String(r.s).padStart(3,"0")+".mp3";const st=r.st;stopAt=r.en||1e9;
  const go=()=>{audio.currentTime=st;audio.play().catch(()=>{});setPlay(r.id)};
  if(audio.dataset.src!==src){audio.dataset.src=src;audio.src=src;audio.addEventListener("loadedmetadata",go,{once:true});audio.load()}else go();
}
function render(){
  const L=document.getElementById("list");L.textContent="";
  const vis=ROWS.filter(r=>filter==="all"||(filter==="err"?marks[r.id]==="err":!marks[r.id]));
  const done=ROWS.filter(r=>marks[r.id]).length,errs=ROWS.filter(r=>marks[r.id]==="err").length;
  document.getElementById("count").textContent=`راجعت ${done} من ${ROWS.length} · غلط ${errs}`;
  if(!vis.length){const p=document.createElement("p");p.className="note";p.textContent=filter==="err"?"ما حددت أي غلط للحين.":"خلصت كل الأماكن.";L.append(p);return}
  for(const r of vis){
    const c=document.createElement("div");c.className="c "+(marks[r.id]||"");
    c.innerHTML=`<div class="top"><span class="ref"></span><span class="tm"></span><button class="play"></button></div>
<div><div class="lbl">نص الآية في المصحف</div><div class="q"></div></div>
<div class="acts"><button class="be">غلط</button><button class="bo">سليم</button></div>`;
    c.querySelector(".ref").textContent=`${r.n} · آية ${r.a}`;
    c.querySelector(".tm").textContent=`الدقيقة ${fmt(r.t)}`+(r.o.length?` · يشبه ${r.o.join("، ")}`:"");
    const pb=c.querySelector(".play");pb.dataset.id=r.id;pb.textContent=playing===r.id?"إيقاف":"اسمع";pb.onclick=()=>play(r);
    c.querySelector(".q").textContent=r.q;
    const be=c.querySelector(".be"),bo=c.querySelector(".bo");
    be.setAttribute("aria-pressed",marks[r.id]==="err");bo.setAttribute("aria-pressed",marks[r.id]==="ok");
    be.onclick=()=>mark(r.id,"err");bo.onclick=()=>mark(r.id,"ok");
    L.append(c);
  }
}
async function mark(id,v){
  if(marks[id]===v)delete marks[id];else marks[id]=v;save();render();
}
function fail(){document.getElementById("st").textContent="ما انحفظ آخر اختيار، تأكد من الاتصال وجرب مرة ثانية."}
document.querySelectorAll(".bar button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".bar button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
render();
document.getElementById("st").hidden=true;
document.getElementById("cp").onclick=async()=>{
  const e=ROWS.filter(r=>marks[r.id]==="err").map(r=>`${r.n} ${r.a} (${r.id})`).join("\n")||"ما في أغلاط محددة";
  try{await navigator.clipboard.writeText(e);document.getElementById("cp").textContent="انتسخت، الصقها لي"}catch(_){prompt("انسخ هذا",e)}
};
</script>
